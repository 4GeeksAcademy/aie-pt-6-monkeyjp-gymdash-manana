<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard del gimnasio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="min-h-screen antialiased">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            <p class="text-sm font-semibold uppercase tracking-wide text-emerald-700">Centro de gestión</p>
            <h1 class="mt-1 text-2xl font-semibold">Dashboard del gimnasio</h1>
            <p class="mt-2 text-sm text-slate-600">Actividad, ingresos y clases en un solo lugar.</p>
        </div>
    </header>
    <main class="mx-auto max-w-7xl space-y-8 px-4 py-6 sm:px-6 lg:px-8">
        <h1>Hola Mundo</h1>
        <p class="text-sm text-slate-600">Resumen del mes de referencia · Clases de la semana de referencia</p>
        <section aria-labelledby="filters-heading" class="rounded-md border border-slate-200 bg-white p-4">
            <h2 id="filters-heading" class="sr-only">Filtros del dashboard</h2>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
                <div>
                    <label for="membership-filter" class="mb-1 block text-sm font-medium">Tipo de membresía</label>
                    <select id="membership-filter" name="membership" class="min-h-11 w-full rounded-md border border-slate-300 bg-white px-3 text-sm">
                        <option value="all">Todas</option>
                        <option value="basic">Básica</option>
                        <option value="standard">Estándar</option>
                        <option value="premium">Premium</option>
                    </select>
                </div>
                <div>
                    <label for="day-filter" class="mb-1 block text-sm font-medium">Día de clase</label>
                    <select id="day-filter" name="day" class="min-h-11 w-full rounded-md border border-slate-300 bg-white px-3 text-sm">
                        <option value="all">Todos</option>
                        <option value="mon">Lunes</option>
                        <option value="tue">Martes</option>
                        <option value="wed">Miércoles</option>
                        <option value="thu">Jueves</option>
                        <option value="fri">Viernes</option>
                    </select>
                </div>
                <div>
                    <label for="occupancy-filter" class="mb-1 block text-sm font-medium">Ocupación de clases</label>
                    <select id="occupancy-filter" name="occupancy" class="min-h-11 w-full rounded-md border border-slate-300 bg-white px-3 text-sm">
                        <option value="all">Todas</option>
                        <option value="available">Con plazas</option>
                        <option value="full">Completas</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="reset-filters" type="button" class="min-h-11 w-full rounded-md border border-slate-300 px-3 text-sm font-semibold text-slate-800 hover:bg-slate-50 sm:w-auto">
                        Restablecer filtros
                    </button>
                </div>
            </div>
            <p id="active-filters" class="mt-3 text-sm text-slate-600">Filtros activos: ninguno</p>
        </section>
        <section id="kpi-section" aria-labelledby="kpi-heading" class="space-y-4">
            <h2 id="kpi-heading" class="text-lg font-semibold">Resumen</h2>
            <div id="kpi-grid"></div>
        </section>
        <section id="drivers-section" aria-labelledby="drivers-heading" class="space-y-4">
            <h2 id="drivers-heading" class="text-lg font-semibold">Factores de resultado</h2>
            <div id="drivers-grid"></div>
        </section>
        <section id="operations-section" aria-labelledby="operations-heading" class="space-y-4">
            <h2 id="operations-heading" class="text-lg font-semibold">Detalles operacionales</h2>
            <div id="operations-grid"></div>
        </section>
        <p id="dashboard-status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
